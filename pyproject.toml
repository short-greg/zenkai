[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "zenkai"
version = "0.0.9"
description = "A framework for flexibly developing beyond bakcpropagation."
homepage = "https://github.com/short-greg/zenkai"
repository = "https://github.com/short-greg/zenkai"
documentation = "https://zenkai.readthedocs.com"
authors = ["Greg Short <g.short@kurenai.waseda.jp>"]
license = "LICENSE"
readme = "README.md"
packages = [
    {include="zenkai"},
    {include="zenkai/lm"},
    {include="zenkai/optimz"},
    {include="zenkai/tansaku"},
    {include="zenkai/nnz"},
    {include="zenkai/utils"},
    {include="zenkai/utils/memory"},
]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
numpy = ">=1"
pandas = ">=1"
scikit-learn = ">=1.0.0"
torch = ">=2,<3"
tqdm = ">=4.0"
scipy = ">=1.5"

[tool.poetry.group.dev.dependencies]
# Dev tooling is intentionally unpinned: this is a library, and the lint/test tools
# track their latest releases (tox already installs them unpinned).
pytest = "*"
flake8 = "*"
isort = "*"
black = "*"
blacken-docs = "*"
